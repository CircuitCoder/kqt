name: Integration Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-18

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build release binaries
        working-directory: ./rust
        run: cargo build --bin kqt --release --verbose

      - name: Run integration tests
        working-directory: ./rust/test
        run: |
          # Set KQT_BIN to the built binary
          export KQT_BIN="$(pwd)/../target/release/kqt"
          
          # Run all test suites with sudo
          sudo -E bash run-all.sh

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: rust/test/run/*.log
          if-no-files-found: ignore
