name: Integration Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  integration-test:
    name: Integration Tests (${{ matrix.mode }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        mode: [L2, L3]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-18

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build release binaries
        working-directory: ./rust
        run: cargo build --bin kqt --bin kqt-tester --release --verbose

      - name: Generate certificates
        working-directory: ./rust/tests
        run: |
          # Set KQT_BIN to the built binary
          export KQT_BIN="$(pwd)/../target/release/kqt"
          
          # Create work directory
          mkdir -p run
          
          # Generate certificates
          bash generate-keys.sh run

      - name: Generate configurations
        working-directory: ./rust/tests
        run: |
          # Set KQT_BIN to the built binary
          export KQT_BIN="$(pwd)/../target/release/kqt"
          
          # Generate configurations
          bash generate-configs.sh run ${{ matrix.mode }}

      - name: Run integration tests
        working-directory: ./rust/tests
        run: |
          # Set KQT_BIN to the built binary
          export KQT_BIN="$(pwd)/../target/release/kqt"
          export KQT_TESTER_BIN="$(pwd)/../target/release/kqt-tester"
          
          # Run the integration test with sudo
          sudo -E bash integration-test.sh

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.mode }}
          path: rust/tests/run/*.log
          if-no-files-found: ignore
