name: Android Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-18
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build native library for arm64-v8a
        working-directory: ./rust/kqt-kotlin
        run: cargo ndk -t arm64-v8a build --lib --release -o ./libs

      - name: Build native library for armeabi-v7a
        working-directory: ./rust/kqt-kotlin
        run: cargo ndk -t armeabi-v7a build --lib --release -o ./libs

      - name: Copy native libraries to jniLibs
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/jniLibs/armeabi-v7a
          cp rust/kqt-kotlin/libs/arm64-v8a/libkqt.so android/app/src/main/jniLibs/arm64-v8a/
          cp rust/kqt-kotlin/libs/armeabi-v7a/libkqt.so android/app/src/main/jniLibs/armeabi-v7a/

      - name: Generate Kotlin bindings with uniffi-bindgen
        working-directory: ./rust/kqt-kotlin
        run: cargo run --features=uniffi/cli --bin uniffi-bindgen generate --library ./libs/arm64-v8a/libkqt.so --language kotlin --out-dir ../../android/app/src/main/java/uniffi/kqt

      - name: Get commit SHA
        id: git-info
        shell: bash
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        working-directory: ./android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        working-directory: ./android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Get version name
        id: version-info
        shell: bash
        run: |
          VERSION=$(grep "versionName" android/app/build.gradle.kts | sed -E 's/.*versionName = "(.*)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Rename debug APKs
        shell: bash
        run: |
          cd android/app/build/outputs/apk/debug
          for apk in *.apk; do
            if [[ "$apk" == *"arm64-v8a"* ]]; then
              mv "$apk" "kqt-debug-arm64-v8a-${{ steps.version-info.outputs.version }}-${{ steps.git-info.outputs.sha_short }}.apk"
            elif [[ "$apk" == *"armeabi-v7a"* ]]; then
              mv "$apk" "kqt-debug-armeabi-v7a-${{ steps.version-info.outputs.version }}-${{ steps.git-info.outputs.sha_short }}.apk"
            elif [[ "$apk" == *"universal"* ]]; then
              mv "$apk" "kqt-debug-universal-${{ steps.version-info.outputs.version }}-${{ steps.git-info.outputs.sha_short }}.apk"
            fi
          done

      - name: Rename release APKs
        shell: bash
        run: |
          cd android/app/build/outputs/apk/release
          for apk in *.apk; do
            if [[ "$apk" == *"arm64-v8a"* ]]; then
              mv "$apk" "kqt-release-arm64-v8a-${{ steps.version-info.outputs.version }}-${{ steps.git-info.outputs.sha_short }}.apk"
            elif [[ "$apk" == *"armeabi-v7a"* ]]; then
              mv "$apk" "kqt-release-armeabi-v7a-${{ steps.version-info.outputs.version }}-${{ steps.git-info.outputs.sha_short }}.apk"
            elif [[ "$apk" == *"universal"* ]]; then
              mv "$apk" "kqt-release-universal-${{ steps.version-info.outputs.version }}-${{ steps.git-info.outputs.sha_short }}.apk"
            fi
          done

      - name: Upload debug arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: kqt-debug-arm64-v8a-${{ steps.version-info.outputs.version }}-${{ steps.git-info.outputs.sha_short }}
          path: android/app/build/outputs/apk/debug/kqt-debug-arm64-v8a-${{ steps.version-info.outputs.version }}-${{ steps.git-info.outputs.sha_short }}.apk
          if-no-files-found: error

      - name: Upload debug armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: kqt-debug-armeabi-v7a-${{ steps.version-info.outputs.version }}-${{ steps.git-info.outputs.sha_short }}
          path: android/app/build/outputs/apk/debug/kqt-debug-armeabi-v7a-${{ steps.version-info.outputs.version }}-${{ steps.git-info.outputs.sha_short }}.apk
          if-no-files-found: error

      - name: Upload debug universal APK
        uses: actions/upload-artifact@v4
        with:
          name: kqt-debug-universal-${{ steps.version-info.outputs.version }}-${{ steps.git-info.outputs.sha_short }}
          path: android/app/build/outputs/apk/debug/kqt-debug-universal-${{ steps.version-info.outputs.version }}-${{ steps.git-info.outputs.sha_short }}.apk
          if-no-files-found: error

      - name: Upload release arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: kqt-release-arm64-v8a-${{ steps.version-info.outputs.version }}-${{ steps.git-info.outputs.sha_short }}
          path: android/app/build/outputs/apk/release/kqt-release-arm64-v8a-${{ steps.version-info.outputs.version }}-${{ steps.git-info.outputs.sha_short }}.apk
          if-no-files-found: error

      - name: Upload release armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: kqt-release-armeabi-v7a-${{ steps.version-info.outputs.version }}-${{ steps.git-info.outputs.sha_short }}
          path: android/app/build/outputs/apk/release/kqt-release-armeabi-v7a-${{ steps.version-info.outputs.version }}-${{ steps.git-info.outputs.sha_short }}.apk
          if-no-files-found: error

      - name: Upload release universal APK
        uses: actions/upload-artifact@v4
        with:
          name: kqt-release-universal-${{ steps.version-info.outputs.version }}-${{ steps.git-info.outputs.sha_short }}
          path: android/app/build/outputs/apk/release/kqt-release-universal-${{ steps.version-info.outputs.version }}-${{ steps.git-info.outputs.sha_short }}.apk
          if-no-files-found: error
