name: Android Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get commit SHA
        id: git-info
        shell: bash
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        working-directory: ./rust/kqt-android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: ./rust/kqt-android
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        working-directory: ./rust/kqt-android
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kqt-android-debug-${{ steps.git-info.outputs.sha_short }}
          path: rust/kqt-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: kqt-android-release-${{ steps.git-info.outputs.sha_short }}
          path: rust/kqt-android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
