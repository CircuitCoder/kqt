name: Android Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-18
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build native library for arm64-v8a
        working-directory: ./rust/kqt-kotlin
        run: cargo ndk -t arm64-v8a build --lib --release -o ./libs

      - name: Build native library for armeabi-v7a
        working-directory: ./rust/kqt-kotlin
        run: cargo ndk -t armeabi-v7a build --lib --release -o ./libs

      - name: Copy native libraries to jniLibs
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/jniLibs/armeabi-v7a
          cp rust/kqt-kotlin/libs/arm64-v8a/libkqt.so android/app/src/main/jniLibs/arm64-v8a/
          cp rust/kqt-kotlin/libs/armeabi-v7a/libkqt.so android/app/src/main/jniLibs/armeabi-v7a/

      - name: Generate Kotlin bindings with uniffi-bindgen
        working-directory: ./rust/kqt-kotlin
        run: cargo run --features=uniffi/cli --bin uniffi-bindgen generate --library ./libs/arm64-v8a/libkqt.so --language kotlin --out-dir ../../android/app/src/main/java/uniffi/kqt

      - name: Get commit SHA
        id: git-info
        shell: bash
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        working-directory: ./android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: ./android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        working-directory: ./android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Get version from APK
        id: version-info
        shell: bash
        run: |
          # Extract version from the universal debug APK using aapt
          # Use wildcard to match the actual APK name (e.g., app-universal-debug.apk)
          APK_PATH=$(ls android/app/build/outputs/apk/debug/*universal*.apk 2>/dev/null | head -1)
          
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "Error: Universal debug APK not found"
            echo "Looking in: android/app/build/outputs/apk/debug/"
            ls -la android/app/build/outputs/apk/debug/ || echo "Debug directory does not exist"
            exit 1
          fi
          
          echo "Using APK: $APK_PATH"
          
          # Use aapt to extract version name from APK
          VERSION=$(aapt dump badging "$APK_PATH" | grep "versionName" | sed -E "s/.*versionName='([^']+)'.*/\1/")
          
          if [ -z "$VERSION" ]; then
            echo "Error: Could not extract version name from APK"
            aapt dump badging "$APK_PATH" | head -20
            exit 1
          fi
          
          echo "Extracted version from APK: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if signed
        id: signing-status
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "signed=true" >> $GITHUB_OUTPUT
          else
            echo "signed=false" >> $GITHUB_OUTPUT
          fi

      - name: Rename debug APKs
        shell: bash
        run: ./.github/scripts/rename-apks.sh debug ${{ steps.version-info.outputs.version }} ${{ steps.git-info.outputs.sha_short }} ${{ steps.signing-status.outputs.signed }}

      - name: Rename release APKs
        shell: bash
        run: ./.github/scripts/rename-apks.sh release ${{ steps.version-info.outputs.version }} ${{ steps.git-info.outputs.sha_short }} ${{ steps.signing-status.outputs.signed }}

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: kqt-apks-${{ steps.version-info.outputs.version }}-${{ steps.git-info.outputs.sha_short }}
          path: |
            android/app/build/outputs/apk/debug/kqt-*.apk
            android/app/build/outputs/apk/release/kqt-*.apk
          if-no-files-found: error
