name: Android Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-18
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build native library for arm64-v8a
        working-directory: ./rust/kqt-kotlin
        run: cargo ndk -t arm64-v8a build --lib --release -o ./libs

      - name: Build native library for armeabi-v7a
        working-directory: ./rust/kqt-kotlin
        run: cargo ndk -t armeabi-v7a build --lib --release -o ./libs

      - name: Copy native libraries to jniLibs
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/jniLibs/armeabi-v7a
          cp rust/kqt-kotlin/libs/arm64-v8a/libkqt.so android/app/src/main/jniLibs/arm64-v8a/
          cp rust/kqt-kotlin/libs/armeabi-v7a/libkqt.so android/app/src/main/jniLibs/armeabi-v7a/

      - name: Generate Kotlin bindings with uniffi-bindgen
        working-directory: ./rust/kqt-kotlin
        run: cargo run --features=uniffi/cli --bin uniffi-bindgen generate --library ./libs/arm64-v8a/libkqt.so --language kotlin --out-dir ../../android/app/src/main/java/uniffi/kqt

      - name: Get commit SHA
        id: git-info
        shell: bash
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        working-directory: ./android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace

      - name: Decode keystore
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > ${{ github.workspace }}/android/app/release.keystore
          else
            echo "Warning: KEYSTORE_BASE64 secret not found. Skipping signing."
          fi

      - name: Build release APK
        working-directory: ./android
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Clean up keystore
        if: always()
        run: rm -f ${{ github.workspace }}/android/app/release.keystore

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: kqt-android-debug-${{ steps.git-info.outputs.sha_short }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: kqt-android-release-${{ steps.git-info.outputs.sha_short }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
