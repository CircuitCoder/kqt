name: Android Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-18
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build native library for arm64-v8a
        working-directory: ./rust/kqt-kotlin
        run: cargo ndk -t arm64-v8a build --lib --release -o ./libs

      - name: Build native library for armeabi-v7a
        working-directory: ./rust/kqt-kotlin
        run: cargo ndk -t armeabi-v7a build --lib --release -o ./libs

      - name: Copy native libraries to jniLibs
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/jniLibs/armeabi-v7a
          cp rust/kqt-kotlin/libs/arm64-v8a/libkqt.so android/app/src/main/jniLibs/arm64-v8a/
          cp rust/kqt-kotlin/libs/armeabi-v7a/libkqt.so android/app/src/main/jniLibs/armeabi-v7a/

      - name: Generate Kotlin bindings with uniffi-bindgen
        working-directory: ./rust/kqt-kotlin
        run: cargo run --features=uniffi/cli --bin uniffi-bindgen generate --library ./libs/arm64-v8a/libkqt.so --language kotlin --out-dir ../../android/app/src/main/java/uniffi/kqt

      - name: Get commit SHA
        id: git-info
        shell: bash
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        working-directory: ./android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: ./android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        working-directory: ./android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Check if signed
        id: signing-status
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "signed=true" >> $GITHUB_OUTPUT
          else
            echo "signed=false" >> $GITHUB_OUTPUT
          fi

      - name: Collect and rename APKs
        shell: bash
        run: |
          # Create collection directory
          mkdir -p upload
          
          COMMIT_HASH="${{ steps.git-info.outputs.sha_short }}"
          SIGNED="${{ steps.signing-status.outputs.signed }}"
          
          # Determine suffix based on signing status
          SUFFIX=""
          if [ "$SIGNED" != "true" ]; then
            SUFFIX="-UNSIGNED"
          fi
          
          # Collect APKs
          for apk in android/app/build/outputs/collected/kqt-*.apk; do
            if [ -f "$apk" ]; then
              filename=$(basename "$apk")
              # Insert commit hash before .apk extension
              new_name="${filename%.apk}-${COMMIT_HASH}${SUFFIX}.apk"
              cp "$apk" "upload/$new_name"
              echo "Collected: $new_name"
            fi
          done
          
          echo "All collected APKs:"
          ls -1 upload/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: kqt-apks-${{ steps.git-info.outputs.sha_short }}
          path: upload/*.apk
          if-no-files-found: error
