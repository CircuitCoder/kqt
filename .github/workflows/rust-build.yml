name: Rust Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }} (Rust ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        toolchain: [nightly-2026-01-18, nightly]
        include:
          - os: ubuntu-latest
            toolchain: nightly-2026-01-18
            artifact-name: kqt-linux
            binary-ext: ''
            upload-artifact: true
          - os: windows-latest
            toolchain: nightly-2026-01-18
            artifact-name: kqt-windows
            binary-ext: '.exe'
            upload-artifact: true
          - os: ubuntu-latest
            toolchain: nightly
            binary-ext: ''
            upload-artifact: false
          - os: windows-latest
            toolchain: nightly
            binary-ext: '.exe'
            upload-artifact: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get commit SHA
        id: git-info
        shell: bash
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Install Rust ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ${{ matrix.toolchain }}

      - name: Build release binaries
        working-directory: ./rust
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo build --workspace --release --verbose --bins

      - name: Prepare binaries for upload
        if: matrix.upload-artifact == true
        shell: bash
        run: |
          set -e
          mkdir -p binaries
          # Find all binary targets in workspace members only
          echo "Finding binary targets in workspace..."
          
          cd rust
          metadata=$(cargo metadata --no-deps --format-version 1)
          workspace_members=$(echo "$metadata" | jq '.workspace_members')
          binaries=$(echo "$metadata" | jq -r --argjson wm "$workspace_members" '.packages[] | select([.id] | inside($wm)) | .targets[] | select(.kind[] == "bin") | .name')
          cd ..
          
          if [ -z "$binaries" ]; then
            echo "Error: No binary targets found in workspace"
            exit 1
          fi
          
          copied_count=0
          while IFS= read -r binary; do
            if [[ -z "$binary" ]]; then
              continue
            fi
            binary_path="rust/target/release/${binary}${{ matrix.binary-ext }}"
            if [ -f "$binary_path" ]; then
              echo "Copying binary: $binary"
              cp "$binary_path" binaries/
              copied_count=$((copied_count + 1))
            else
              echo "Warning: Binary not found at $binary_path"
            fi
          done <<< "$binaries"
          
          if [ $copied_count -eq 0 ]; then
            echo "Error: No binaries were copied"
            exit 1
          fi
          
          echo "Successfully copied $copied_count binary(ies)"

      - name: Upload binaries
        if: matrix.upload-artifact == true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}-${{ steps.git-info.outputs.sha_short }}
          path: binaries/*
          if-no-files-found: error
