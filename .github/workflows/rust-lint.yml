name: Rust Lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  format:
    name: Check Code Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-18
          components: rustfmt

      - name: Check formatting
        working-directory: ./rust
        run: cargo fmt --all -- --check

  unused-deps:
    name: Check Unused Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-18
          targets: aarch64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install cargo-udeps
        run: cargo install cargo-udeps --locked

      - name: Check unused dependencies in kqt-lib
        working-directory: ./rust
        run: cargo udeps --package kqt-lib --all-targets

      - name: Check unused dependencies in kqt
        working-directory: ./rust
        run: cargo udeps --package kqt --all-targets

      - name: Check unused dependencies in kqt-android
        working-directory: ./rust
        run: cargo udeps --package kqt-android --target aarch64-linux-android
