[versions]
agp = "9.0.0"
coreKtx = "1.17.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
activityKtx = "1.12.3"
recyclerview = "1.4.0"
coordinatorlayout = "1.3.0"
constraintlayout = "2.2.1"
